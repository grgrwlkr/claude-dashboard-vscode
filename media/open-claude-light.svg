<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The light-theme half of the pair. Same geometry as `open-claude-dark.svg`,
       deeper stops: the dark file's teal is a pale stroke on white, and a toolbar
       icon that washes out is one nobody finds. -->
  <!-- userSpaceOnUse for the same reason as in the dark file: a bounding-box
       gradient drops the underscore, whose box has no height. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="1" y1="15" x2="15" y2="1">
      <stop offset="0" stop-color="#4338CA"/><stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <path d="M2.6 4.2 L6.4 8 L2.6 11.8" fill="none" stroke="url(#g)" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.4 13.2 H13.6" fill="none" stroke="url(#g)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M11.6 2.6 C12 4.6 12.9 5.5 14.9 5.9 C12.9 6.3 12 7.2 11.6 9.2
           C11.2 7.2 10.3 6.3 8.3 5.9 C10.3 5.5 11.2 4.6 11.6 2.6 Z" fill="url(#g)"/>
</svg>
