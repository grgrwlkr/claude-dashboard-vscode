<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- A prompt with a spark over it: a terminal session, and a thinking one. Drawn
       in the extension's own teal-to-indigo, running bottom-left to top-right so
       the chevron reads indigo and the spark reads teal — the brighter end on the
       smaller shape, which is what survives at 16 px. This is the dark-theme file;
       `open-claude-light.svg` is the same geometry with the stops deepened. -->
  <!-- userSpaceOnUse, not the default: the underscore is a horizontal line, so its
       bounding box has no height, and a gradient measured in bounding-box units
       makes it disappear entirely. It also means one gradient runs across the
       whole icon rather than restarting inside each shape. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="1" y1="15" x2="15" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <path d="M2.6 4.2 L6.4 8 L2.6 11.8" fill="none" stroke="url(#g)" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.4 13.2 H13.6" fill="none" stroke="url(#g)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M11.6 2.6 C12 4.6 12.9 5.5 14.9 5.9 C12.9 6.3 12 7.2 11.6 9.2
           C11.2 7.2 10.3 6.3 8.3 5.9 C10.3 5.5 11.2 4.6 11.6 2.6 Z" fill="url(#g)"/>
</svg>
