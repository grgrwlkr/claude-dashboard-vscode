name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # Both supported platforms run the suite: the token path and the process
    # walk differ between them, and a macOS-only run would never notice.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # The extension runs inside VS Code's extension host, not under a Node
        # anyone installs, so both ends of this matrix are the versions Electron
        # ships — and both are measured, not guessed (2026-08-11):
        #   VS Code 1.100.3, the floor of `engines.vscode ^1.100.0` → Node 20.19.0
        #   VS Code 1.132.0, current                                → Node 24.18.0
        # Read from ewanharris/vscode-versions, and 24.18.0 confirmed against the
        # Electron framework binary of the installed editor.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.js

  package:
    # Packaging catches what tests cannot: a manifest that no longer parses, a
    # missing icon, and files that should never have entered the .vsix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx @vscode/vsce package --no-dependencies -o extension.vsix
      - name: what went into the package
        run: npx @vscode/vsce ls --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension.vsix
