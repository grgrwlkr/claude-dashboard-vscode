name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # Both supported platforms run the suite: the token path and the process
    # walk differ between them, and a macOS-only run would never notice.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # The extension runs inside VS Code's extension host, not under a Node
        # anyone installs — so the version that matters is the one Electron
        # ships. VS Code 1.132 carries Node 24.18.0 (read out of the Electron
        # framework binary, 2026-08-11), and that is the upper end here.
        # 20 is the conservative floor for `engines.vscode ^1.100.0`; which Node
        # that release actually shipped has not been checked, so the floor is a
        # precaution rather than a measurement.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.js

  package:
    # Packaging catches what tests cannot: a manifest that no longer parses, a
    # missing icon, and files that should never have entered the .vsix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx @vscode/vsce package --no-dependencies -o extension.vsix
      - name: what went into the package
        run: npx @vscode/vsce ls --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension.vsix
